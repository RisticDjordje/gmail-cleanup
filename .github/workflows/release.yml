name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Builds with a read-only token: dependency install scripts never see write credentials.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: gmail-cleanup-*.zip
          retention-days: 7

  # Only this job can write, and it runs no project code or dependencies.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gmail-cleanup-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
